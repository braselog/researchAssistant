name: quality
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff pyyaml
      - run: python .github/scripts/audit_placeholders.py
      - run: ruff check --select E9,F63,F7,F82 .
      - run: pytest -q
